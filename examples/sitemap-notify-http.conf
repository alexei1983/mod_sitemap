# Load this after mod_sitemap.
LoadModule sitemap_notify_http_module modules/mod_sitemap_notify_http.so

# Never expose this endpoint without authorization. Require local is suitable
# when PHP/Python run on the same host and call 127.0.0.1.
<Location /_internal/sitemap-notify>
    SetHandler sitemap-notify
    Require local
</Location>

# If local applications use a different virtual host, use an authenticated
# internal hostname and an application-specific credential instead.
